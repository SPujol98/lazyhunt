name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste tokens, `.env` contents, real CVs or real job postings.** Redact anything personal. For security problems use the private reporting process in the security policy instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Prefer the demo profile (`profiles/demo/`) and synthetic data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, browser and version.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redacted output only.
      render: shell
