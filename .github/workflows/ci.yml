name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run mypy --strict cva
      - run: uv run ruff check cva tests bot.py cli.py scripts
