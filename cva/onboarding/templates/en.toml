# Judge templates for the profile /setup generates (onboarding-v2 T7), English.
# Placeholders ($name) are filled ONLY with answers the user gave
# (cva/onboarding/profile_gen.py). Rubric texts are rules for the judge, never
# facts about the candidate.

marker = "<!-- generated by /setup — edit to improve results -->"

[facts]
intro = "Candidate facts stated during /setup. Nothing else is known about the candidate beyond these lines and the claims list: never assume experience, skills, education or languages that are not there."
targets = "Target positions: $targets"
level = "Level: $level"
work_modes = "Work modes: $work_modes"
location = "Work location: $location"
salary = "Minimum salary: $amount $currency gross per year"
languages = "Spoken languages: $languages"
skills = "Main skills: $skills"

# Text of the setup-experience claim (T8): the years answer, then the last
# role (and company) exactly as typed.
[experience]
"0" = "No professional experience yet"
lt1 = "Less than 1 year of professional experience"
"1-2" = "1-2 years of professional experience"
"3-5" = "3-5 years of professional experience"
"6-10" = "6-10 years of professional experience"
10plus = "More than 10 years of professional experience"
role = "Last role: $role"
role_at = "Last role: $role at $company"

[words]
junior = "junior"
mid = "mid"
senior = "senior"
remote = "remote"
hybrid = "hybrid"
onsite = "on-site"

[rubric]
preamble = """Judge rubric generated by /setup from your answers. Edit any section to
improve results; keep exactly one heading per slot (sub-headings use ###)."""
manual_analyses = "for a candidate whose profile was just set up, using only the facts and claims given below"
degree_rule = "A degree requirement phrased with ANY equivalence wording ('or equivalent experience', 'or similar') is NOT a wall. A degree requirement with NO such wording is a hard wall only when the claims list shows no matching degree."
hard_walls = """A hard wall is ONLY one of these cases - never any other requirement, however strict it sounds:
1. A degree requirement with NO equivalence wording (see above).
2. $experience_wall
3. $seniority_wall
4. A mandatory stack with ZERO evidence in the claims that is the role's DAILY CORE (what most of the working week is spent on)."""
soft_walls = "EVERYTHING ELSE is a SOFT wall (lower the score a bit, NEVER force discard by itself): a tool merely mentioned or listed as a plus, a framework listed as one option among several, a new business domain, and anything phrased as 'nice to have' or 'a plus'."

[level.junior]
experience_rule = "Required years of experience up to and including ~3 years is a MINOR penalty ONLY - never a wall and never by itself a reason to discard: junior candidates normally apply to offers asking for up to 3 years. Years required well above 3 (4+ years) IS a hard wall."
experience_wall = "Years of required experience of 4+ (up to and including ~3 years is a minor penalty only)."
seniority_wall = "Seniority or technical leadership of a team (Senior/Lead/Principal, managing or mentoring team members)."

[level.mid]
experience_rule = "Required years of experience up to and including ~5 years is a MINOR penalty ONLY - never a wall by itself. Years required well above 5 (7+ years) IS a hard wall. A role for juniors only (internship, 0-1 years) is a soft wall."
experience_wall = "Years of required experience of 7+ (up to and including ~5 years is a minor penalty only)."
seniority_wall = "Lead, Principal or people-management roles (a Senior title alone is a soft wall)."

[level.senior]
experience_rule = "Required years of experience are NEVER a wall for this candidate. A role for juniors only (internship, 0-1 years) is a soft wall: it is below the stated level."
experience_wall = "Nothing about years of experience (never a wall at this level); use this case only for a role that is people management as the main job."
seniority_wall = "People management as the main job (Head of, Engineering Manager, Director)."

[level.none]
experience_rule = "Required years of experience up to and including ~3 years is a MINOR penalty ONLY. Years required well above 3 (5+ years) IS a hard wall."
experience_wall = "Years of required experience of 5+."
seniority_wall = "Lead, Principal or people-management roles."

[family.ai]
lacking_core = "For AI roles: using AI coding tools in the daily workflow is a SMALL PLUS ONLY - it never outweighs a daily core the claims do not show (for example frontend frameworks, cloud-platform engineering, BI reporting, or training your own models as the main job)."
positive = "For AI roles: the role's daily core is applied AI (LLMs, RAG, retrieval, ML engineering) and its stack appears in the claims."

[family.backend]
lacking_core = "For Backend roles: a stack the claims do not show (another language or framework) is a wall only when it is the role's daily core; a full-stack role whose daily core is frontend stays low-scored."
positive = "For Backend roles: the role's daily core is server-side development (APIs, databases, services) in a stack that appears in the claims."

[family.custom]
lacking_core = "For $titles roles: a daily core the claims do not show stays low-scored, whatever the title says; generic praise of tools or practices never substitutes for it."
positive = "For $titles roles: the title and the daily core match the target positions and the requirements appear in the claims."

[family.none]
lacking_core = "A daily core the claims do not show stays low-scored, whatever the title says."
positive = "The role's daily core appears in the claims."

[signals]
common = "Positive signals: wording open to the stated level, a work mode and location that match the stated preferences, few applicants or a fresh posting."
