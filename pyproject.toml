[project]
name = "cva"
version = "0.1.0"
description = "Job tracker + CV generation assistant (SDD change: job-tracker-mvp)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fpdf2>=2.8",
    "httpx>=0.27",
    "openpyxl>=3.1.5",
    "pypdf>=4.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.4",
    "python-telegram-bot[job-queue]>=21.4",
    "google-auth-oauthlib>=1.5.0",
    "google-api-python-client>=2.201.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cva"]

# Google client libraries ship without type information for these modules; the
# untyped surface is isolated in cva/gmail/client.py behind typed wrappers.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true
