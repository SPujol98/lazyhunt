<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-labelledby="t d">
  <title id="t">The LazyHunt sloth signing off</title>
  <desc id="d">The LazyHunt sloth hangs from a branch by one arm, holding a tiny Telegram card with a match score.</desc>
  <defs>
    <style>
      .w{font:700 19px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#FBEBD0}
      .s{font:400 14px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#C9BFE0}
      .sw{transform-origin:110px 22px;animation:sw 5s ease-in-out infinite}
      @keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      @media (prefers-reduced-motion:reduce){.sw{animation:none}}
    </style>
  </defs>
  <rect width="480" height="150" rx="22" fill="#221D38"/>
  <!-- branch -->
  <path d="M14 24 C80 16 150 28 220 20" stroke="#6B4A36" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M60 20 C66 8 80 6 90 10 C80 12 70 16 60 20Z M170 24 C180 12 196 12 204 16 C192 18 182 22 170 24Z" fill="#4E8A55"/>
  <g class="sw">
    <!-- hanging arm -->
    <path d="M110 22 C110 40 112 52 114 64" stroke="#8A6749" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M104 18 l2 -8 M110 17 l0 -9 M116 18 l-2 -8" stroke="#3B2A22" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="116" cy="96" rx="26" ry="36" fill="#9A7656"/>
    <ellipse cx="118" cy="104" rx="16" ry="22" fill="#B08B68" opacity=".7"/>
    <!-- head -->
    <circle cx="140" cy="70" r="23" fill="#9A7656"/>
    <ellipse cx="143" cy="73" rx="17" ry="15" fill="#E9D3B0"/>
    <path d="M131 68 C134 62 141 64 140 70 C138 75 131 74 131 68Z M147 68 C150 62 157 64 156 70 C154 75 147 74 147 68Z" fill="#4A3428"/>
    <path d="M133 70 C135 72 137 72 139 70 M149 70 C151 72 153 72 155 70" stroke="#FBEBD0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="144" cy="79" rx="4" ry="2.6" fill="#3B2A22"/>
    <path d="M138 84 C141 87 147 87 150 84" stroke="#3B2A22" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- arm holding a card -->
    <path d="M132 110 C146 114 158 112 168 106" stroke="#8A6749" stroke-width="11" stroke-linecap="round" fill="none"/>
    <rect x="166" y="88" width="58" height="30" rx="7" fill="#FBEBD0"/>
    <rect x="173" y="96" width="20" height="5" rx="2.5" fill="#6B5A80"/>
    <rect x="173" y="105" width="14" height="5" rx="2.5" fill="#B7AACB"/>
    <rect x="198" y="93" width="21" height="20" rx="5" fill="#4E8A55"/>
    <path d="M203 103 l3.5 3.5 l6 -7" stroke="#FBEBD0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- legs -->
    <path d="M104 126 C100 134 98 138 96 142 M126 128 C128 134 130 138 132 142" stroke="#8A6749" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="248" y="70" class="w">Go stretch your legs.</text>
  <text x="248" y="96" class="s">The next round runs without you.</text>
</svg>
